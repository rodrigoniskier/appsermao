name: Quality

on:
  push:
    branches: [main, production-foundation-2026]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff pip-audit

      - name: Compile Python sources
        run: python -m compileall -q app.py exposibot tests migrations

      - name: Static sanity checks
        run: ruff check --select E9,F63,F7,F82 app.py exposibot tests migrations

      - name: Run tests
        env:
          SECRET_KEY: ci-test-secret-key
        run: python -m unittest discover -s tests -v

      - name: Audit dependencies
        if: matrix.python-version == '3.12'
        run: pip-audit -r requirements.txt
