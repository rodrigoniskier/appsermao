<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exposibot - Pesquisa</title>
    <style>
        /* --- VARIÁVEIS --- */
        :root { --bg-dark: #1a202c; --bg-panel: #2d3748; --text-main: #e2e8f0; --accent: #3182ce; --border: #4a5568; --gold: #d69e2e; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg-dark); color: var(--text-main); height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }

        /* HEADER */
        header { background: #171923; padding: 0 20px; border-bottom: 1px solid var(--border); height: 50px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
        header h1 { font-size: 1.2rem; }

        /* MAIN LAYOUT (20% - 55% - 25%) */
        main { display: grid; grid-template-columns: 20% 55% 25%; flex: 1; height: 100%; overflow: hidden; }

        .column { border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
        .panel-header { background: var(--bg-panel); padding: 10px; font-size: 0.8rem; font-weight: bold; text-transform: uppercase; text-align: center; border-bottom: 1px solid var(--border); flex-shrink: 0;}

        /* COLUNA 1: INPUT + TOOLS */
        .input-area { padding: 15px; border-bottom: 1px solid var(--border); background: #232936; }
        .input-area label { display: block; color: #a0aec0; font-size: 0.75rem; margin-bottom: 5px; }
        #bible-ref { width: 100%; padding: 8px; background: #1a202c; border: 1px solid var(--accent); color: white; border-radius: 4px; font-weight: bold; }

        .tools-grid { padding: 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .btn-tool { background: var(--bg-panel); color: white; border: 1px solid var(--border); padding: 10px; text-align: left; border-radius: 4px; cursor: pointer; transition: 0.2s; font-size: 0.85rem; }
        .btn-tool:hover { background: var(--accent); border-color: var(--accent); }
        .btn-tool i { margin-right: 8px; width: 20px; display: inline-block; text-align: center; }

        /* COLUNA 2: RESULTADO IA (FOCO) */
        .ai-display { flex: 1; padding: 30px; overflow-y: auto; font-family: 'Georgia', serif; line-height: 1.8; font-size: 1.05rem; background: #202530;}
        .ai-display h2 { color: #90cdf4; border-bottom: 1px solid #4a5568; padding-bottom: 5px; margin-top: 20px; }
        .ai-display strong { color: white; }
        .ai-footer { padding: 10px; background: #232936; border-top: 1px solid var(--border); text-align: right; display: flex; justify-content: space-between; align-items: center;}
        #loading { display: none; color: var(--gold); font-style: italic; }

        /* COLUNA 3: NOTAS */
        .notes-area { flex: 1; padding: 15px; overflow-y: auto; font-size: 0.9rem; color: #cbd5e0; }
        .note-item { margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px dashed #4a5568; }
        .note-tag { color: var(--gold); font-size: 0.75rem; font-weight: bold; text-transform: uppercase; display: block; margin-bottom: 4px; }

        .action-area { padding: 15px; background: #171923; border-top: 1px solid var(--border); text-align: center; }
        .btn-next { width: 100%; background: var(--success); color: white; padding: 12px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 1rem; }
        .btn-action { background: var(--accent); color: white; padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; }

    </style>
</head>
<body>

    <header>
        <h1>Exposibot <span style="font-size:0.7em; color:#718096;">| Pesquisa & Exegese</span></h1>
        <span style="color: #718096; font-size: 0.8rem;">Soli Deo Gloria</span>
    </header>

    <main>
        <!-- ESQUERDA: REFERÊNCIA E BOTÕES -->
        <section class="column">
            <div class="panel-header">1. Texto e Ferramentas</div>
            <div class="input-area">
                <label>REFERÊNCIA BÍBLICA</label>
                <input type="text" id="bible-ref" placeholder="Ex: Romanos 8:28-30">
            </div>
            <div class="tools-grid">
                <button class="btn-tool" onclick="analisar('Dados Geográficos')">📍 Geografa</button>
                <button class="btn-tool" onclick="analisar('Perfil Biográfico')">👤 Biografia</button>
                <button class="btn-tool" onclick="analisar('Contexto Histórico')">📜 Histórico</button>
                <button class="btn-tool" onclick="analisar('Contexto Canônico')">🔗 Canônico</button>
                <button class="btn-tool" onclick="analisar('Estilo Literário')">✍️ Literário</button>
                <button class="btn-tool" onclick="analisar('Contexto Político')">🏛️ Político</button>
                <button class="btn-tool" onclick="analisar('Sócio-Cultural')">🏺 Sócio-Cultural</button>
                <button class="btn-tool" onclick="analisar('Contexto Filosófico')">🧠 Filosófico</button>
                <button class="btn-tool" onclick="analisar('Teologia Sistemática')">✝️ Sistemática</button>
                <button class="btn-tool" onclick="analisar('Foco Cristocêntrico')">🩸 Cristocêntrico</button>
                <button class="btn-tool" style="border-color: var(--gold); color: var(--gold);" onclick="analisar('Exegese (BHS/UBS5)')">🔍 Exegese Técnica</button>
            </div>
        </section>

        <!-- CENTRO: RESULTADO DA IA -->
        <section class="column">
            <div class="panel-header">2. Resultado da Análise</div>
            <div class="ai-display" id="ai-output">
                <div style="text-align: center; color: #718096; margin-top: 50px;">
                    <p>Digite a referência à esquerda e selecione uma lente de análise.</p>
                </div>
            </div>
            <div class="ai-footer">
                <span id="loading">Consultando Padrões Reformados...</span>
                <button class="btn-action" onclick="incorporar()">Incorporar às Notas →</button>
            </div>
        </section>

        <!-- DIREITA: NOTAS E AVANÇAR -->
        <section class="column">
            <div class="panel-header">3. Material Coletado</div>
            <div class="notes-area" id="staged-content" contenteditable="true">
                <!-- Notas aparecem aqui -->
            </div>
            <div class="action-area">
                <button class="btn-next" onclick="irParaHomiletica()">IR PARA HOMILÉTICA ➜</button>
            </div>
        </section>
    </main>

    <!-- FORMULÁRIO OCULTO PARA NAVEGAR -->
    <form id="nav-form" action="/homiletics" method="POST" target="_blank" style="display:none;">
        <input type="hidden" name="reference">
        <textarea name="notes_content"></textarea>
    </form>

    <script>
        let lastRaw = "";
        let lastType = "";

        async function analisar(tipo) {
            const ref = document.getElementById('bible-ref').value;
            if(!ref) { alert("Digite a referência bíblica."); return; }

            document.getElementById('loading').style.display = "inline";
            document.getElementById('ai-output').style.opacity = "0.5";

            try {
                const req = await fetch('/api/analyze', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ texto: ref, tipo: tipo })
                });
                const res = await req.json();

                if(res.error) {
                    document.getElementById('ai-output').innerHTML = `<span style="color:red">${res.error}</span>`;
                } else {
                    document.getElementById('ai-output').innerHTML = res.resultado;
                    lastRaw = res.resultado;
                    lastType = tipo;
                }
            } catch(e) {
                document.getElementById('ai-output').innerText = "Erro de conexão.";
            } finally {
                document.getElementById('loading').style.display = "none";
                document.getElementById('ai-output').style.opacity = "1";
            }
        }

        function incorporar() {
            if(!lastRaw) return;
            const area = document.getElementById('staged-content');
            const div = document.createElement('div');
            div.className = 'note-item';
            div.innerHTML = `<span class="note-tag">[${lastType}]</span> ${lastRaw}`;
            area.appendChild(div);
            area.scrollTop = area.scrollHeight;
        }

        function irParaHomiletica() {
            const form = document.getElementById('nav-form');
            const notes = document.getElementById('staged-content').innerHTML;
            const ref = document.getElementById('bible-ref').value;

            if(!ref) { alert("Preencha a referência bíblica antes de avançar."); return; }

            form.querySelector('[name=reference]').value = ref;
            form.querySelector('[name=notes_content]').value = notes;
            form.submit();
        }
    </script>
</body>
</html>
