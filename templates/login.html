{% extends "base.html" %}
{% block title %}Entrar | Exposibot{% endblock %}
{% block header %}{% endblock %}
{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <h1>Exposibot</h1>
        <p class="subtitle">Entre para acessar seus sermões</p>
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label for="login-email">E-mail</label>
                <input id="login-email" type="email" name="email" maxlength="255" autocomplete="email" required autofocus>
            </div>
            <div class="form-group">
                <label for="login-password">Senha</label>
                <input id="login-password" type="password" name="password" autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn btn-accent">Entrar</button>
        </form>
        <div class="switch">Não tem conta? <a href="{{ url_for('auth.register') }}">Cadastre-se</a></div>
    </div>
</div>
{% endblock %}
