{% extends "base.html" %}
{% block title %}Entrar | Exposibot{% endblock %}
{% block header %}{% endblock %}
{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <h1>Exposibot</h1>
        <p class="subtitle">Entre para acessar seus sermões</p>
        <form method="POST">
            <div class="form-group">
                <label>E-mail</label>
                <input type="email" name="email" required autofocus>
            </div>
            <div class="form-group">
                <label>Senha</label>
                <input type="password" name="password" required>
            </div>
            <button type="submit" class="btn btn-accent">Entrar</button>
        </form>
        <div class="switch">Não tem conta? <a href="{{ url_for('auth.register') }}">Cadastre-se</a></div>
    </div>
</div>
{% endblock %}
