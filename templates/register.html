{% extends "base.html" %}
{% block title %}Criar conta | Exposibot{% endblock %}
{% block header %}{% endblock %}
{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <h1>Exposibot</h1>
        <p class="subtitle">Crie sua conta para salvar suas pesquisas e sermões</p>
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label>Nome</label>
                <input type="text" name="name" required autofocus>
            </div>
            <div class="form-group">
                <label>E-mail</label>
                <input type="email" name="email" required>
            </div>
            <div class="form-group">
                <label>Senha (mín. 8 caracteres)</label>
                <input type="password" name="password" minlength="8" required>
            </div>
            <button type="submit" class="btn btn-accent">Criar conta</button>
        </form>
        <div class="switch">Já tem conta? <a href="{{ url_for('auth.login') }}">Entrar</a></div>
    </div>
</div>
{% endblock %}
