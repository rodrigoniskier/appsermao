{% extends "base.html" %}
{% block title %}Criar conta | Exposibot{% endblock %}
{% block header %}{% endblock %}
{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <h1>Exposibot</h1>
        <p class="subtitle">Crie sua conta para salvar suas pesquisas e sermões</p>
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label for="register-name">Nome</label>
                <input id="register-name" type="text" name="name" maxlength="120" autocomplete="name" required autofocus>
            </div>
            <div class="form-group">
                <label for="register-email">E-mail</label>
                <input id="register-email" type="email" name="email" maxlength="255" autocomplete="email" required>
            </div>
            <div class="form-group">
                <label for="register-password">Senha (mín. 10 caracteres)</label>
                <input id="register-password" type="password" name="password" minlength="10" autocomplete="new-password" required>
            </div>
            <button type="submit" class="btn btn-accent">Criar conta</button>
        </form>
        <div class="switch">Já tem conta? <a href="{{ url_for('auth.login') }}">Entrar</a></div>
    </div>
</div>
{% endblock %}
