<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratório Homilético</title>
    <style>
        :root { --bg-dark: #1a202c; --bg-panel: #2d3748; --text: #e2e8f0; --gold: #d69e2e; --border: #4a5568; --success: #38a169; }
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: var(--bg-dark);
            color: var(--text);
            height: 100vh; /* Altura total da janela */
            display: flex;
            flex-direction: column;
            overflow: hidden; /* Impede scroll no body */
        }

        header {
            background: #171923;
            padding: 0 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 60px; /* Altura fixa */
            flex-shrink: 0;
        }
        h1 { font-size: 1.1rem; color: var(--gold); font-weight: 600; }

        /* Layout Principal */
        main {
            display: grid;
            grid-template-columns: 30% 70%;
            height: calc(100vh - 60px); /* Ocupa exatamente o resto da tela */
            overflow: hidden;
        }

        /* Sidebar (Notas) */
        .sidebar {
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            background: #232936;
            overflow: hidden;
        }
        .panel-title { padding: 10px; background: var(--bg-panel); font-weight: bold; font-size: 0.8rem; text-align: center; border-bottom: 1px solid var(--border); }
        .notes-content {
            flex: 1;
            padding: 15px;
            overflow-y: auto; /* Scroll independente */
            font-size: 0.85rem;
            color: #cbd5e0;
            line-height: 1.5;
        }

        /* Form Area */
        .form-area {
            padding: 0; /* Padding interno no container */
            overflow-y: auto; /* Scroll independente */
            background: var(--bg-dark);
            position: relative;
        }
        .form-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 30px;
            padding-bottom: 100px; /* Espaço para o botão flutuante */
        }

        /* Inputs */
        .form-group { margin-bottom: 15px; }
        label { display: block; color: #a0aec0; font-size: 0.8rem; margin-bottom: 5px; }
        input, textarea, select { width: 100%; background: #2d3748; border: 1px solid var(--border); color: white; padding: 10px; border-radius: 4px; font-family: inherit; }
        textarea { resize: vertical; min-height: 80px; line-height: 1.4; }

        .section-title { color: var(--gold); border-bottom: 1px solid var(--border); padding-bottom: 5px; margin: 30px 0 15px 0; font-size: 1.1rem; font-weight: bold; }

        /* Tópicos */
        .sermon-point { background: rgba(255,255,255,0.03); padding: 20px; border-radius: 8px; margin-bottom: 20px; border-left: 4px solid var(--gold); }
        .btn-add { width: 100%; background: #4a5568; color: white; padding: 10px; border: none; border-radius: 4px; cursor: pointer; margin-bottom: 20px; font-weight: bold;}

        /* Botões de Ação */
        .btn-preview {
            position: fixed; bottom: 30px; right: 40px;
            background: var(--gold); color: #1a202c;
            padding: 15px 30px; border: none; border-radius: 50px;
            font-weight: bold; box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            cursor: pointer; transition: 0.2s; z-index: 100;
        }
        .btn-preview:hover { transform: scale(1.05); }

        .btn-ai-suggest {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; border: none; padding: 8px 16px; border-radius: 20px;
            font-size: 0.85rem; cursor: pointer; display: flex; align-items: center; gap: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2); transition: 0.2s;
        }
        .btn-ai-suggest:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn-ai-suggest:disabled { opacity: 0.5; cursor: wait; }

        /* Loader */
        #ai-loader { display: none; margin-left: 10px; font-size: 0.8rem; color: #a0aec0; font-style: italic;}
    </style>
</head>
<body>

    <header>
        <div>
            <h1>Laboratório Homilético</h1>
            <div style="font-size: 0.8rem; color: #a0aec0;">Texto: <strong>{{ reference }}</strong></div>
        </div>
        <div style="display:flex; align-items:center;">
            <span id="ai-loader">Lendo notas e estruturando sermão...</span>
            <button type="button" class="btn-ai-suggest" onclick="suggestSermon()">
                ✨ Sugestão da IA
            </button>
        </div>
    </header>

    <main>
        <!-- SIDEBAR: NOTAS -->
        <aside class="sidebar">
            <div class="panel-title">Notas de Pesquisa (Contexto)</div>
            <div class="notes-content" id="notes-raw">
                {% if notes %}
                    {{ notes | safe }}
                {% else %}
                    <p style="font-style:italic; opacity:0.6; padding:20px; text-align:center;">Nenhuma nota importada da pesquisa.</p>
                {% endif %}
            </div>
        </aside>

        <!-- MAIN: FORMULÁRIO -->
        <section class="form-area">
            <form id="sermon-form" action="/view_sermon" method="POST" target="_blank" class="form-container">
                <input type="hidden" id="ref-input" name="texto_biblico" value="{{ reference }}">

                <div class="section-title" style="margin-top:0;">Estrutura Fundamental</div>

                <div class="form-group">
                    <label>Ideia Central do Texto (ICT)</label>
                    <input type="text" id="ict" name="ict" placeholder="O que o texto dizia para os leitores originais?">
                </div>
                <div class="form-group">
                    <label>Tese / Proposição</label>
                    <input type="text" id="tese" name="tese" placeholder="A verdade atemporal para a audiência de hoje">
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <div class="form-group">
                        <label>Propósito Básico</label>
                        <select id="prop_basico" name="proposito_basico">
                            <option value="">Selecione...</option>
                            <option>Doutrinário</option>
                            <option>Evangelístico</option>
                            <option>Consolação</option>
                            <option>Ético/Moral</option>
                            <option>Consagração</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Propósito Específico</label>
                        <input type="text" id="prop_especifico" name="proposito_especifico" placeholder="O que espera que a igreja faça?">
                    </div>
                </div>

                <div class="section-title">Corpo do Sermão</div>

                <div class="form-group">
                    <label>Introdução</label>
                    <textarea id="intro" name="intro" placeholder="Gancho, Contexto e Transição..."></textarea>
                </div>

                <div id="points-container">
                    <!-- Tópicos serão inseridos aqui -->
                </div>

                <button type="button" class="btn-add" onclick="addPoint()">+ Adicionar Tópico Manualmente</button>

                <div class="form-group">
                    <label>Conclusão</label>
                    <textarea id="conclusao" name="conclusao" placeholder="Recapitulação e Apelo Final..."></textarea>
                </div>

                <!-- Botão Flutuante -->
                <button type="submit" class="btn-preview">GERAR PREVIEW E BAIXAR 📄</button>
            </form>
        </section>
    </main>

    <script>
        // Adiciona um ponto em branco
        function addPoint(data = null) {
            const container = document.getElementById('points-container');
            const div = document.createElement('div');
            div.className = 'sermon-point';

            // Valores padrão ou vindos da IA
            const val = data || { titulo: '', explicacao: '', ilustracao: '', aplicacao: '' };

            div.innerHTML = `
                <div class="form-group">
                    <label style="color:var(--gold); font-weight:bold;">Título do Tópico</label>
                    <input type="text" name="topico_titulo[]" value="${val.titulo}" placeholder="Divisão do texto">
                </div>
                <div class="form-group">
                    <label>Explicação (Exegese)</label>
                    <textarea name="topico_explicacao[]" rows="4">${val.explicacao}</textarea>
                </div>
                <div class="form-group">
                    <label>Ilustração</label>
                    <textarea name="topico_ilustracao[]" rows="2" placeholder="Metafora ou história breve">${val.ilustracao}</textarea>
                </div>
                <div class="form-group">
                    <label>Aplicação</label>
                    <textarea name="topico_aplicacao[]" rows="2" placeholder="Como isso muda a vida do ouvinte?">${val.aplicacao}</textarea>
                </div>
                <div style="text-align:right;">
                    <button type="button" onclick="this.parentElement.parentElement.remove()" style="background:transparent; border:none; color:#fc8181; cursor:pointer; font-size:0.8rem;">Excluir Tópico</button>
                </div>
            `;
            container.appendChild(div);
        }

        // Se não houver pontos, adiciona um vazio ao iniciar
        if(document.getElementById('points-container').children.length === 0) {
            addPoint();
        }

        // Lógica da IA Sugestiva
        async function suggestSermon() {
            const notes = document.getElementById('notes-raw').innerText;
            const ref = document.getElementById('ref-input').value;
            const btn = document.querySelector('.btn-ai-suggest');
            const loader = document.getElementById('ai-loader');

            if (notes.trim().length < 50) {
                if(!confirm("Você tem poucas notas de pesquisa. A IA pode não ser tão precisa. Deseja continuar mesmo assim?")) return;
            }

            // UI Loading
            btn.disabled = true;
            loader.style.display = 'inline';

            try {
                const response = await fetch('/api/suggest_sermon', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ notes: notes, reference: ref })
                });

                const data = await response.json();

                if (data.error) {
                    alert("Erro na IA: " + data.error);
                } else {
                    // Preencher campos simples
                    document.getElementById('ict').value = data.ict || '';
                    document.getElementById('tese').value = data.tese || '';
                    document.getElementById('prop_especifico').value = data.proposito_especifico || '';
                    document.getElementById('intro').value = data.intro || '';
                    document.getElementById('conclusao').value = data.conclusao || '';

                    // Tentar selecionar o dropdown
                    const sel = document.getElementById('prop_basico');
                    for(let i=0; i<sel.options.length; i++) {
                        if(sel.options[i].text.includes(data.proposito_basico)) {
                            sel.selectedIndex = i;
                            break;
                        }
                    }

                    // Preencher Tópicos
                    const container = document.getElementById('points-container');
                    container.innerHTML = ''; // Limpa os atuais
                    if (data.topicos && Array.isArray(data.topicos)) {
                        data.topicos.forEach(point => addPoint(point));
                    } else {
                        addPoint(); // Adiciona um vazio se falhar
                    }
                }

            } catch (e) {
                alert("Erro de conexão: " + e);
            } finally {
                btn.disabled = false;
                loader.style.display = 'none';
            }
        }
    </script>
</body>
</html>
